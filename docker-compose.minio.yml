services:
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bucketcommander
      MINIO_ROOT_PASSWORD: bucketcommander123
    ports:
      - "9000:9000"
      - "9001:9001"
    tmpfs:
      - /data:size=2g

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    entrypoint: /bin/sh
    command:
      - -c
      - |
        until mc alias set local http://minio:9000 bucketcommander bucketcommander123; do
          sleep 1
        done
        mc mb --ignore-existing local/bucket-commander
        mc cp --recursive /seed/ local/bucket-commander/
    volumes:
      - ./docker/minio/seed:/seed:ro
