name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    name: Checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: uv sync --locked --group dev
      - name: Check code with Ruff
        run: uv run --no-sync ruff check .
      - name: Check types with mypy
        run: uv run --no-sync mypy src tests
      - name: Run tests
        run: uv run --no-sync pytest

  release-test:
    name: Test release packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          expected_tag = f"v{version}"
          if os.environ["RELEASE_TAG"] != expected_tag:
              raise SystemExit(f"Release tag must be {expected_tag}")
          PY
      - name: Build wheel and source distribution
        run: uv build --no-sources
      - name: Test installation and CLI from each distribution
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          for package in dist/*.whl dist/*.tar.gz; do
            version=$(uv tool run --isolated --from "$package" bc --version)
            test "$version" = "bc ${RELEASE_TAG#v}"
            uv tool run --isolated --from "$package" bc --help
          done
      - name: Upload tested release packages
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
